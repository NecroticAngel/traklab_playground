<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackLab — Header Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#232544; --amber:#ffb700; --amber-deep:#e8920f;
    --ink:#232544; --muted:#7a7d93; --line:#e2e5f0; --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,sans-serif;background:#fbfcfe;color:var(--ink);min-height:100vh;}
  a{text-decoration:none;color:inherit;}
  .tk{font-family:"Rajdhani",system-ui,sans-serif;}

  .hdr{position:relative;background:var(--bg);border-bottom:1px solid var(--line);}
  .accent{height:3px;background:linear-gradient(90deg,var(--amber-deep),var(--amber) 40%,transparent 78%);}
  .bar{max-width:1280px;margin:0 auto;height:84px;display:flex;align-items:center;gap:22px;padding:0 28px;}

  .logo{display:flex;align-items:center;padding-right:22px;border-right:1px solid var(--line);height:46px;}
  .logo img{height:34px;width:auto;display:block;}

  .deco{flex:none;opacity:.9;}

  nav{flex:1;display:flex;align-items:center;justify-content:center;gap:34px;}
  nav a{position:relative;font-family:"Rajdhani";font-weight:600;font-size:17px;letter-spacing:2px;
    color:var(--navy);padding:8px 2px;transition:color .15s;}
  nav a .num{font-size:10px;color:var(--muted);letter-spacing:1px;margin-right:6px;vertical-align:2px;transition:color .15s;}
  nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:3px;width:0;background:var(--amber);
    clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%);transition:width .18s;}
  nav a:hover{color:var(--amber-deep);}
  nav a:hover .num{color:var(--amber-deep);}
  nav a:hover::after,nav a.active::after{width:100%;}
  nav a.active{color:var(--amber-deep);}

  .right{flex:none;display:flex;align-items:center;gap:18px;}
  .signin{font-family:"Rajdhani";font-weight:600;letter-spacing:2px;font-size:15px;color:var(--navy);}
  .signin:hover{color:var(--amber-deep);}
  .cta{display:inline-flex;align-items:center;gap:9px;background:var(--amber);color:#3a2606;
    font-family:"Rajdhani";font-weight:700;letter-spacing:1.5px;font-size:15px;padding:12px 24px;
    clip-path:polygon(0 0,100% 0,100% 100%,12px 100%);transition:.15s;}
  .cta:hover{background:#ffc52e;box-shadow:0 6px 18px rgba(255,183,0,.35);}
  .cta svg{stroke:#3a2606;}

  /* animated data-bus on the bottom edge */
  .bus{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;}
  .bus .pulse{position:absolute;top:0;left:-80px;width:60px;height:2px;
    background:linear-gradient(90deg,transparent,var(--amber));box-shadow:0 0 10px 1px var(--amber);
    animation:bus 4.2s linear infinite;}
  @keyframes bus{0%{left:-80px}100%{left:100%}}
  .ticks{position:absolute;right:28px;bottom:6px;display:flex;gap:6px;}
  .ticks i{width:10px;height:3px;background:var(--line);display:block;}
  .ticks i.on{background:var(--amber);}

  /* faint context preview below */
  .preview{max-width:1280px;margin:40px auto;padding:0 28px;color:var(--muted);}
  .preview .ey{font-family:"Rajdhani";font-weight:600;letter-spacing:4px;font-size:13px;color:var(--amber-deep);}
  .preview h1{font-family:"Rajdhani";font-weight:700;font-size:44px;letter-spacing:1px;color:var(--navy);margin-top:6px;}

  @media(max-width:820px){nav{display:none;} .signin{display:none;}}
</style>
</head>
<body>
  <header class="hdr">
    <div class="accent"></div>
    <div class="bar">
      <a class="logo" href="landing.html"><img src="WEB-Tracklab-Logo-1536x461.png" alt="TrackLab"></a>

      <svg class="deco" width="120" height="40" viewBox="0 0 120 40" fill="none">
        <line x1="0" y1="20" x2="58" y2="20" stroke="#d9deec" stroke-width="1.4" stroke-dasharray="2 5"/>
        <circle cx="78" cy="20" r="9" fill="none" stroke="#d9deec" stroke-width="1.4" stroke-dasharray="2 3">
          <animateTransform attributeName="transform" type="rotate" from="0 78 20" to="360 78 20" dur="9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="78" cy="20" r="2.5" fill="#ffb700"/>
        <line x1="92" y1="20" x2="120" y2="20" stroke="#d9deec" stroke-width="1.4"/>
      </svg>

      <nav>
        <a class="active" href="landing.html"><span class="num">01</span>MAIN PAGE</a>
        <a href="infographic.html"><span class="num">02</span>TECHNOLOGY</a>
        <a href="#"><span class="num">03</span>SYSTEM</a>
        <a href="#"><span class="num">04</span>ABOUT US</a>
      </nav>

      <div class="right">
        <a class="signin tk" href="#">SIGN IN</a>
        <a class="cta" href="#">GET STARTED
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>

    <div class="bus"><span class="pulse"></span></div>
    <div class="ticks"><i></i><i></i><i class="on"></i><i></i></div>
  </header>

  <div class="preview">
    <div class="ey">SYSTEM COMPONENTS</div>
    <h1>Robust Tracking Hardware &amp; Embedded Software</h1>
  </div>
</body>
</html>
