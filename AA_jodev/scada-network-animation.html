<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA Network Animation</title>
<style>
  :root{
    --bg:#0a0a14;
    --panel:#1a1b2e;
    --panel2:#232544;
    --orange:#F39A2C;
    --orange-soft:#ffb74d;
    --ink:#e9eaf2;
    --muted:#8b8da6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;color:var(--ink);
  }
  .stage{
    position:relative;width:100%;max-width:1100px;aspect-ratio:1024/600;margin:auto;
  }
  svg{width:100%;height:100%;display:block;}
  .lbl{font-weight:700;letter-spacing:1.5px;}
  text{font-family:inherit;}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated SCADA network architecture: devices and internet feed through a cloud and protocol gateway to an NCU, which links over LoRa and RS485 to multiple TCUs.">

  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="cloudG" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#e3e4ec"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5418"/>
      <stop offset="100%" stop-color="#F39A2C"/>
    </linearGradient>
  </defs>

  <!-- ============ WIRES (drawn first, behind nodes) ============ -->
  <g fill="none" stroke="#5a4a2e" stroke-width="2.4" opacity="0.55">
    <!-- protocol pills -> NCU bus -->
    <path id="w1" d="M495 300 H560 V363 H612"/>
    <path id="w2" d="M495 336 H545 V363 H612"/>
    <path id="w3" d="M495 372 H612"/>
    <path id="w4" d="M495 408 H545 V363 H612"/>
    <path id="w5" d="M495 444 H560 V363 H612"/>
    <!-- NCU -> right protocols -->
    <path id="w6" d="M714 363 H760 V292 H826"/>
    <path id="w7" d="M714 363 H760 V452 H826"/>
    <!-- right protocols -> TCUs -->
    <path id="w8" d="M952 292 H975 V215 H988"/>
    <path id="w9" d="M952 452 H975 V520 H988"/>
    <!-- devices/internet -> cloud (implied feed) -->
    <path id="w10" d="M150 470 H210"/>
    <!-- cloud left side -> up into devices circle -->
    <path id="w11" d="M168 318 H92 V227"/>
    <!-- branch straight up from internet line into the cloud -->
    <path id="w12" d="M210 470 V372"/>
  </g>

  <!-- animated dashed energy overlay on each wire -->
  <g fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round"
     stroke-dasharray="2 16" opacity="0.9">
    <use href="#w1"><animate attributeName="stroke-dashoffset" from="0" to="180" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#w2"><animate attributeName="stroke-dashoffset" from="0" to="180" dur="2.7s" repeatCount="indefinite"/></use>
    <use href="#w3"><animate attributeName="stroke-dashoffset" from="0" to="180" dur="2.1s" repeatCount="indefinite"/></use>
    <use href="#w4"><animate attributeName="stroke-dashoffset" from="0" to="180" dur="2.9s" repeatCount="indefinite"/></use>
    <use href="#w5"><animate attributeName="stroke-dashoffset" from="0" to="180" dur="2.5s" repeatCount="indefinite"/></use>
    <use href="#w6"><animate attributeName="stroke-dashoffset" from="0" to="200" dur="2.3s" repeatCount="indefinite"/></use>
    <use href="#w7"><animate attributeName="stroke-dashoffset" from="0" to="200" dur="2.6s" repeatCount="indefinite"/></use>
    <use href="#w8"><animate attributeName="stroke-dashoffset" from="0" to="160" dur="2.0s" repeatCount="indefinite"/></use>
    <use href="#w9"><animate attributeName="stroke-dashoffset" from="0" to="160" dur="2.2s" repeatCount="indefinite"/></use>
    <use href="#w11"><animate attributeName="stroke-dashoffset" from="0" to="-150" dur="2.0s" repeatCount="indefinite"/></use>
  </g>

  <!-- glowing data packets travelling the wires (TCU -> devices, right to left) -->
  <g fill="var(--orange-soft)" filter="url(#glow)">
    <circle r="4.5"><animateMotion dur="2.4s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.7s" begin="0.5s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.1s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.9s" begin="0.3s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.5s" begin="0.8s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.3s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.6s" begin="0.6s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w7"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.0s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w8"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.2s" begin="0.4s" calcMode="linear" keyPoints="1;0" keyTimes="0;1" repeatCount="indefinite"><mpath href="#w9"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#w11"/></animateMotion></circle>
  </g>

  <!-- ============ CLOUD ============ -->
  <g>
    <path fill="url(#cloudG)" d="M150 360
      a78 78 0 0 1 70 -120
      a92 92 0 0 1 168 -34
      a70 70 0 0 1 96 36
      a64 64 0 0 1 8 128
      H170
      a72 72 0 0 1 -20 -10 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- INTEGRATION TO SCADA -->
  <text x="300" y="214" text-anchor="middle" class="lbl" font-size="13" fill="#5b5d72">INTEGRATION TO</text>
  <g>
    <rect x="248" y="224" width="104" height="34" rx="6" fill="var(--orange)" filter="url(#softglow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="300" y="247" text-anchor="middle" class="lbl" font-size="17" fill="#3a2606">SCADA</text>
  </g>

  <!-- INTERNET CONNECTION node inside cloud -->
  <g>
    <circle cx="110" cy="470" r="46" fill="#1a1b2e" stroke="#2c2e4a" stroke-width="2"/>
    <circle cx="110" cy="470" r="46" fill="none" stroke="var(--orange)" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="46;54;46" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#cfd0e0" stroke-width="1.6" fill="none">
      <circle cx="110" cy="470" r="17"/>
      <ellipse cx="110" cy="470" rx="7" ry="17"/>
      <line x1="93" y1="470" x2="127" y2="470"/>
      <line x1="96" y1="461" x2="124" y2="461"/>
      <line x1="96" y1="479" x2="124" y2="479"/>
    </g>
  </g>
  <text x="110" y="540" text-anchor="middle" class="lbl" font-size="13" fill="var(--orange)">INTERNET</text>
  <text x="110" y="558" text-anchor="middle" class="lbl" font-size="13" fill="var(--orange)">CONNECTION</text>

  <!-- ============ DEVICES (top-left) ============ -->
  <text x="92" y="28" text-anchor="middle" class="lbl" font-size="14" fill="var(--orange)">DEVICES</text>
  <g font-size="13" class="lbl" text-anchor="middle">
    <g>
      <rect x="34" y="40" width="116" height="26" rx="6" fill="#232544"/>
      <text x="92" y="58" fill="#dfe0ee">MOBILE</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="34" y="72" width="116" height="26" rx="6" fill="#232544"/>
      <text x="92" y="90" fill="#dfe0ee">TABLET</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="34" y="104" width="116" height="26" rx="6" fill="#232544"/>
      <text x="92" y="122" fill="#dfe0ee">PC</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </g>
  </g>
  <g>
    <circle cx="92" cy="185" r="40" fill="#1a1b2e" stroke="#2c2e4a" stroke-width="2"/>
    <g stroke="#cfd0e0" stroke-width="1.5" fill="none">
      <rect x="74" y="166" width="16" height="22" rx="2"/>
      <rect x="96" y="172" width="20" height="14" rx="2"/>
      <circle cx="84" cy="200" r="6"/>
      <line x1="84" y1="188" x2="84" y2="194"/>
      <line x1="106" y1="186" x2="106" y2="196"/>
    </g>
  </g>

  <!-- ============ PROTOCOL PILLS (left of NCU) ============ -->
  <g class="lbl" font-size="14" text-anchor="middle">
    <g><rect x="388" y="285" width="107" height="30" rx="6" fill="#232544" stroke="#3a3d63" stroke-width="1"/><text x="441" y="305" fill="#e9eaf2">RS485</text></g>
    <g><rect x="388" y="321" width="107" height="30" rx="6" fill="#232544" stroke="#3a3d63" stroke-width="1"/><text x="441" y="341" fill="#e9eaf2">RS232</text></g>
    <g><rect x="388" y="357" width="107" height="30" rx="6" fill="#232544" stroke="#3a3d63" stroke-width="1"/><text x="441" y="377" fill="#e9eaf2">WiFi</text></g>
    <g><rect x="388" y="393" width="107" height="30" rx="6" fill="#232544" stroke="#3a3d63" stroke-width="1"/><text x="441" y="413" fill="#e9eaf2">CAN</text></g>
    <g><rect x="388" y="429" width="107" height="30" rx="6" fill="#232544" stroke="#3a3d63" stroke-width="1"/><text x="441" y="449" fill="#e9eaf2">ETHERNET</text></g>
  </g>

  <!-- ============ NCU (gateway) ============ -->
  <g>
    <circle cx="663" cy="363" r="52" fill="#f4f5fb"/>
    <circle cx="663" cy="363" r="52" fill="none" stroke="var(--orange)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="52;62;52" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(663,363)" stroke="#23243a" stroke-width="1.8" fill="none">
      <rect x="-22" y="-24" width="44" height="15" rx="3"/>
      <rect x="-22" y="-7" width="44" height="15" rx="3"/>
      <rect x="-22" y="10" width="44" height="15" rx="3"/>
      <circle cx="-13" cy="-16.5" r="1.6" fill="#23243a"/>
      <circle cx="-13" cy="0.5" r="1.6" fill="#23243a"/>
      <circle cx="-13" cy="17.5" r="1.6" fill="#23243a"/>
      <line x1="2" y1="-16.5" x2="14" y2="-16.5"/>
      <line x1="2" y1="0.5" x2="14" y2="0.5"/>
      <line x1="2" y1="17.5" x2="14" y2="17.5"/>
    </g>
  </g>
  <g>
    <rect x="623" y="430" width="80" height="32" rx="6" fill="#232544"/>
    <text x="663" y="452" text-anchor="middle" class="lbl" font-size="16" fill="var(--orange)">NCU</text>
  </g>

  <!-- ============ RIGHT PROTOCOLS ============ -->
  <g class="lbl" font-size="14" text-anchor="middle">
    <g><rect x="826" y="277" width="126" height="30" rx="6" fill="#232544" stroke="#3a3d63" stroke-width="1"/><text x="889" y="297" fill="#e9eaf2">LoRa</text></g>
    <g><rect x="826" y="437" width="126" height="30" rx="6" fill="#232544" stroke="#3a3d63" stroke-width="1"/><text x="889" y="457" fill="#e9eaf2">RS485</text></g>
  </g>

  <!-- ============ TCUs (far right) ============ -->
  <g>
    <rect x="965" y="150" width="50" height="130" rx="12" fill="#f4f5fb"/>
    <g transform="translate(990,188)" stroke="#23243a" stroke-width="1.5" fill="none">
      <rect x="-12" y="-12" width="24" height="18" rx="2"/>
      <line x1="-12" y1="-6" x2="12" y2="-6"/><line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-4" y1="-12" x2="-4" y2="6"/><line x1="4" y1="-12" x2="4" y2="6"/>
    </g>
    <text x="990" y="258" text-anchor="middle" class="lbl" font-size="17" fill="#23243a" transform="rotate(0 990 258)">TCU</text>
  </g>
  <g fill="var(--orange)">
    <circle cx="990" cy="350" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="363" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.25s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="376" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <rect x="965" y="455" width="50" height="130" rx="12" fill="#f4f5fb"/>
    <g transform="translate(990,493)" stroke="#23243a" stroke-width="1.5" fill="none">
      <rect x="-12" y="-12" width="24" height="18" rx="2"/>
      <line x1="-12" y1="-6" x2="12" y2="-6"/><line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-4" y1="-12" x2="-4" y2="6"/><line x1="4" y1="-12" x2="4" y2="6"/>
    </g>
    <text x="990" y="563" text-anchor="middle" class="lbl" font-size="17" fill="#23243a">TCU</text>
  </g>

</svg>
</div>
</body>
</html>
