<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Tracker Animation</title>
<style>
  :root{
    --bg:#0a0a14; --panel:#1a1b2e; --panel2:#232544;
    --orange:#F39A2C; --orange-soft:#ffb74d; --ink:#e9eaf2; --muted:#5b5d72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;color:var(--ink);}
  .stage{position:relative;width:100%;max-width:1100px;aspect-ratio:1024/600;margin:auto;}
  svg{width:100%;height:100%;display:block;}
  .lbl{font-weight:700;letter-spacing:1.5px;}
  .mono{font-variant-numeric:tabular-nums;letter-spacing:1px;}
  text{font-family:inherit;}
  @keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
  .star{animation:tw 2.6s ease-in-out infinite;}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated solar tracker through a full day and night: the sun arcs across the sky while a solar panel pivots to track it, a control unit reports tracking angle and power output, and at night the panel returns to its home position under the moon and stars.">

  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="512" y="44" text-anchor="middle" class="lbl" font-size="13" fill="var(--muted)">SUN-TRACKING SOLAR ARRAY</text>

  <!-- stars (shown at night) -->
  <g id="stars" opacity="0"></g>

  <!-- sun trajectory guide -->
  <path d="M110 470 Q360 -190 610 470" fill="none" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.22"/>

  <!-- moon (shown at night) -->
  <g id="moon" opacity="0">
    <circle cx="0" cy="0" r="17" fill="#cdd3e6"/>
    <circle cx="7" cy="-3" r="15" fill="#0a0a14"/>
  </g>

  <!-- ground -->
  <line x1="110" y1="480" x2="915" y2="480" stroke="#2c2e4a" stroke-width="2"/>

  <!-- sun -->
  <g id="sun" opacity="0" transform="translate(110 470)">
    <g stroke="var(--orange-soft)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <line x1="0" y1="-30" x2="0" y2="-42"/><line x1="0" y1="30" x2="0" y2="42"/>
      <line x1="-30" y1="0" x2="-42" y2="0"/><line x1="30" y1="0" x2="42" y2="0"/>
      <line x1="-21" y1="-21" x2="-29" y2="-29"/><line x1="21" y1="-21" x2="29" y2="-29"/>
      <line x1="-21" y1="21" x2="-29" y2="29"/><line x1="21" y1="21" x2="29" y2="29"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="var(--orange)" filter="url(#sunglow)"/>
    <circle cx="0" cy="0" r="22" fill="var(--orange-soft)" opacity="0.55"/>
  </g>

  <!-- line of sight beam panel -> sun -->
  <line id="beam" x1="360" y1="410" x2="360" y2="262" stroke="var(--orange)" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="2 10" opacity="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- vertical reference + tilt arc -->
  <line x1="360" y1="410" x2="360" y2="356" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
  <path id="angArc" d="" fill="none" stroke="var(--orange)" stroke-width="2" opacity="0.85"/>

  <!-- post -->
  <rect x="354" y="410" width="12" height="70" rx="2" fill="var(--panel2)" stroke="#3a3d63" stroke-width="1"/>

  <!-- panel (JS rotates) -->
  <g id="panel">
    <rect x="285" y="398" width="150" height="24" rx="3" fill="#16213e" stroke="var(--orange)" stroke-width="1.5"/>
    <rect x="285" y="398" width="150" height="5" rx="2" fill="var(--orange)" opacity="0.8"/>
    <g stroke="#2a3a5c" stroke-width="1">
      <line x1="310" y1="403" x2="310" y2="422"/><line x1="335" y1="403" x2="335" y2="422"/>
      <line x1="360" y1="403" x2="360" y2="422"/><line x1="385" y1="403" x2="385" y2="422"/>
      <line x1="410" y1="403" x2="410" y2="422"/><line x1="285" y1="412" x2="435" y2="412"/>
    </g>
    <!-- sun sensor -->
    <circle cx="360" cy="394" r="4.5" fill="var(--orange)" filter="url(#glow)">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="360" cy="410" r="6" fill="var(--orange)" stroke="#3a2606" stroke-width="1"/>
  <text x="360" y="512" text-anchor="middle" class="lbl" font-size="13" fill="var(--orange)">SOLAR PANEL</text>

  <!-- wire TCU -> panel -->
  <path id="tw" d="M600 455 H366" fill="none" stroke="#5a4a2e" stroke-width="2.4" opacity="0.55"/>
  <use href="#tw" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="2.2s" repeatCount="indefinite"/>
  </use>
  <g fill="var(--orange-soft)" filter="url(#glow)">
    <circle r="4.5"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#tw"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#tw"/></animateMotion></circle>
  </g>

  <!-- TCU -->
  <g>
    <rect x="600" y="408" width="170" height="74" rx="8" fill="var(--panel2)" stroke="#3a3d63" stroke-width="1"/>
    <rect x="600" y="408" width="170" height="74" rx="8" fill="none" stroke="var(--orange)" stroke-width="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="614" y="418" width="142" height="44" rx="4" fill="#16213e"/>
    <text id="statTxt" x="624" y="436" class="lbl" font-size="12" fill="var(--orange-soft)">TRACKING</text>
    <text id="angTxt" x="624" y="453" class="lbl mono" font-size="12" fill="var(--ink)">ANGLE +0&#176;</text>
    <circle cx="624" cy="472" r="3.5" fill="var(--orange)"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="638" cy="472" r="3.5" fill="var(--orange)"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="652" cy="472" r="3.5" fill="var(--orange)"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="685" y="512" text-anchor="middle" class="lbl" font-size="13" fill="var(--orange)">TRACKING CONTROL UNIT</text>

  <!-- power gauge -->
  <g>
    <rect x="58" y="78" width="150" height="150" rx="8" fill="var(--panel2)" stroke="#3a3d63" stroke-width="1"/>
    <text x="133" y="100" text-anchor="middle" class="lbl" font-size="11" fill="var(--muted)">POWER OUTPUT</text>
    <rect x="78" y="114" width="24" height="96" rx="3" fill="#0a1024"/>
    <rect id="pwrFill" x="78" y="210" width="24" height="0" rx="3" fill="var(--orange)"/>
    <text id="pwrTxt" x="160" y="172" text-anchor="middle" class="lbl mono" font-size="26" fill="var(--orange-soft)">0%</text>
    <text x="160" y="194" text-anchor="middle" class="lbl" font-size="10" fill="var(--muted)">OF RATED</text>
  </g>

</svg>
</div>
<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const CYCLE=16000, DAYF=0.7, PX=360, PY=410;
  const $=id=>document.getElementById(id);
  const sun=$("sun"), beam=$("beam"), panel=$("panel"), angArc=$("angArc"),
        pwrFill=$("pwrFill"), pwrTxt=$("pwrTxt"), angTxt=$("angTxt"),
        statTxt=$("statTxt"), moon=$("moon"), stars=$("stars");

  const rnd=(a,b)=>a+Math.random()*(b-a);
  for(let i=0;i<34;i++){
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",rnd(230,820).toFixed(0));
    c.setAttribute("cy",rnd(64,360).toFixed(0));
    c.setAttribute("r",rnd(0.8,1.9).toFixed(1));
    c.setAttribute("fill","#cdd3e6");
    c.setAttribute("class","star");
    c.style.animationDelay=(-rnd(0,2.6)).toFixed(2)+"s";
    stars.appendChild(c);
  }

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const ease=t=>t*t*(3-2*t);
  function sunPos(aDeg){const a=aDeg*Math.PI/180;return {x:PX-0+250*Math.sin(a), y:470-330*Math.cos(a)};}
  function arcPath(deg){const r=46,rad=deg*Math.PI/180;
    const x=(PX+r*Math.sin(rad)).toFixed(1), y=(PY-r*Math.cos(rad)).toFixed(1);
    return `M ${PX} ${PY-r} A ${r} ${r} 0 0 ${deg>=0?1:0} ${x} ${y}`;}

  let start=null;
  function frame(now){
    if(start===null)start=now;
    const p=(((now-start)%CYCLE)+CYCLE)%CYCLE/CYCLE;
    let theta, pct, sunOp=0, beamOp=0, statusTxt, starsOp=0, moonOp=0;

    if(p<DAYF){
      const dp=p/DAYF, aDeg=-90+180*dp;
      const s=sunPos(aDeg);
      const elev=Math.max(0,Math.cos(aDeg*Math.PI/180));
      let az=Math.atan2(s.x-PX, -(s.y-PY))*180/Math.PI;
      theta=clamp(az,-55,55);
      pct=Math.round(elev*100);
      sunOp=clamp(elev*5,0,1);
      beamOp=clamp(elev*1.4,0,1)*0.9;
      statusTxt="TRACKING";
      sun.setAttribute("transform",`translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})`);
      beam.setAttribute("x2",s.x.toFixed(1));
      beam.setAttribute("y2",s.y.toFixed(1));
    } else {
      const np=(p-DAYF)/(1-DAYF);
      const rp=clamp(np/0.35,0,1);
      theta=55+(-110)*ease(rp);
      pct=0;
      statusTxt = np<0.4 ? "RETURN HOME" : "STANDBY";
      starsOp=Math.min(1,Math.min(np*4,(1-np)*4));
      const mDeg=-90+180*np, m=sunPos(mDeg);
      const mElev=Math.max(0,Math.cos(mDeg*Math.PI/180));
      moonOp=clamp(mElev*5,0,1)*0.9;
      moon.setAttribute("transform",`translate(${m.x.toFixed(1)} ${m.y.toFixed(1)})`);
    }

    panel.setAttribute("transform",`rotate(${theta.toFixed(2)} ${PX} ${PY})`);
    angArc.setAttribute("d",arcPath(theta));
    angArc.style.opacity = (p<DAYF?0.85:0.3);
    sun.style.opacity=sunOp;
    beam.style.opacity=beamOp;
    moon.style.opacity=moonOp;
    stars.style.opacity=starsOp;
    const h=pct/100*96;
    pwrFill.setAttribute("y",(210-h).toFixed(1));
    pwrFill.setAttribute("height",h.toFixed(1));
    pwrTxt.textContent=pct+"%";
    statTxt.textContent=statusTxt;
    const r=Math.round(theta);
    angTxt.textContent=`ANGLE ${r>=0?"+":""}${r}°`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
