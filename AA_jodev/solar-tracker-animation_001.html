<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Tracker Animation</title>
<style>
  :root{
    --bg:#0a0a14;
    --panel:#1a1b2e;
    --panel2:#232544;
    --orange:#F39A2C;
    --orange-soft:#ffb74d;
    --ink:#e9eaf2;
    --muted:#5b5d72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;color:var(--ink);
  }
  .stage{position:relative;width:100%;max-width:1100px;aspect-ratio:1024/600;margin:auto;}
  svg{width:100%;height:100%;display:block;}
  .lbl{font-weight:700;letter-spacing:1.5px;}
  text{font-family:inherit;}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated solar tracker: the sun arcs across the sky while a solar panel pivots to stay aimed at it, driven by a tracking control unit.">

  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- top caption -->
  <text x="512" y="44" text-anchor="middle" class="lbl" font-size="13" fill="var(--muted)">SUN-TRACKING SOLAR ARRAY</text>

  <!-- sun trajectory guide -->
  <path d="M150 255 Q380 -10 600 245" fill="none" stroke="var(--orange)" stroke-width="1.5"
        stroke-dasharray="3 9" opacity="0.28"/>

  <!-- ground -->
  <line x1="110" y1="480" x2="915" y2="480" stroke="#2c2e4a" stroke-width="2"/>

  <!-- ============ SUN (arcs across the sky) ============ -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" calcMode="linear"
      keyTimes="0;0.12;0.5;0.82;0.92;1"
      values="150 255; 205 205; 380 125; 555 205; 600 245; 150 255"
      dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" calcMode="linear"
      keyTimes="0;0.12;0.5;0.82;0.92;1"
      values="0;1;1;1;0;0" dur="9s" repeatCount="indefinite"/>
    <!-- rays -->
    <g stroke="var(--orange-soft)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <line x1="0" y1="-32" x2="0" y2="-44"/>
      <line x1="0" y1="32" x2="0" y2="44"/>
      <line x1="-32" y1="0" x2="-44" y2="0"/>
      <line x1="32" y1="0" x2="44" y2="0"/>
      <line x1="-23" y1="-23" x2="-31" y2="-31"/>
      <line x1="23" y1="-23" x2="31" y2="-31"/>
      <line x1="-23" y1="23" x2="-31" y2="31"/>
      <line x1="23" y1="23" x2="31" y2="31"/>
    </g>
    <circle cx="0" cy="0" r="24" fill="var(--orange)" filter="url(#sunglow)"/>
    <circle cx="0" cy="0" r="24" fill="var(--orange-soft)" opacity="0.55"/>
    <text x="0" y="56" text-anchor="middle" class="lbl" font-size="12" fill="var(--orange)">SUN</text>
  </g>

  <!-- ============ POST ============ -->
  <rect x="354" y="410" width="12" height="70" rx="2" fill="var(--panel2)" stroke="#3a3d63" stroke-width="1"/>

  <!-- ============ PANEL (pivots to track the sun) ============ -->
  <g>
    <animateTransform attributeName="transform" type="rotate" calcMode="linear"
      keyTimes="0;0.12;0.5;0.82;0.92;1"
      values="-55 360 410; -45 360 410; 0 360 410; 45 360 410; 55 360 410; -55 360 410"
      dur="9s" repeatCount="indefinite"/>

    <!-- line of sight to the sun -->
    <line x1="360" y1="408" x2="360" y2="262" stroke="var(--orange)" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="2 10" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.4s" repeatCount="indefinite"/>
    </line>

    <!-- panel body -->
    <rect x="285" y="398" width="150" height="24" rx="3" fill="#16213e" stroke="var(--orange)" stroke-width="1.5"/>
    <rect x="285" y="398" width="150" height="5" rx="2" fill="var(--orange)" opacity="0.8"/>
    <g stroke="#2a3a5c" stroke-width="1">
      <line x1="310" y1="403" x2="310" y2="422"/>
      <line x1="335" y1="403" x2="335" y2="422"/>
      <line x1="360" y1="403" x2="360" y2="422"/>
      <line x1="385" y1="403" x2="385" y2="422"/>
      <line x1="410" y1="403" x2="410" y2="422"/>
      <line x1="285" y1="412" x2="435" y2="412"/>
    </g>
  </g>
  <!-- pivot -->
  <circle cx="360" cy="410" r="6" fill="var(--orange)" stroke="#3a2606" stroke-width="1"/>
  <text x="360" y="512" text-anchor="middle" class="lbl" font-size="13" fill="var(--orange)">SOLAR PANEL</text>

  <!-- ============ WIRE: TCU -> panel (tracking commands) ============ -->
  <path id="tw" d="M600 455 H366" fill="none" stroke="#5a4a2e" stroke-width="2.4" opacity="0.55"/>
  <use href="#tw" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round"
       stroke-dasharray="2 16" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="2.2s" repeatCount="indefinite"/>
  </use>
  <g fill="var(--orange-soft)" filter="url(#glow)">
    <circle r="4.5"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#tw"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#tw"/></animateMotion></circle>
  </g>

  <!-- ============ TCU (tracking control unit) ============ -->
  <g>
    <rect x="600" y="408" width="162" height="70" rx="8" fill="var(--panel2)" stroke="#3a3d63" stroke-width="1"/>
    <rect x="600" y="408" width="162" height="70" rx="8" fill="none" stroke="var(--orange)" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- screen -->
    <rect x="614" y="420" width="134" height="30" rx="4" fill="#16213e"/>
    <text x="624" y="440" class="lbl" font-size="12" fill="var(--orange-soft)">TRACKING</text>
    <!-- moving readout bar -->
    <rect x="700" y="430" width="40" height="8" rx="2" fill="#0a1024"/>
    <rect x="700" y="430" width="14" height="8" rx="2" fill="var(--orange)">
      <animate attributeName="x" values="700;726;700" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <!-- status LEDs -->
    <circle cx="622" cy="465" r="3.5" fill="var(--orange)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="636" cy="465" r="3.5" fill="var(--orange)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="465" r="3.5" fill="var(--orange)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="681" y="512" text-anchor="middle" class="lbl" font-size="13" fill="var(--orange)">TRACKING CONTROL UNIT</text>

</svg>
</div>
</body>
</html>
