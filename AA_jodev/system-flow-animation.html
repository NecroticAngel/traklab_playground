<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackLab — System Components Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;}
  body{display:flex;align-items:center;justify-content:center;}
  /* drop .flow anywhere; spans up to 1200 wide, scales down responsively */
  .flow{width:1200px;max-width:100%;}
  .flow svg{width:100%;height:auto;display:block;}
  .flow text{font-family:"Rajdhani",system-ui,sans-serif;}
</style>
</head>
<body>
  <div class="flow">
    <svg viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Animated system flow: solar energy feeds the Tracker Controller Unit, then the Network Control Unit, Monitoring, and Power and Drive systems, with data pulsing left to right.">
      <defs>
        <filter id="g" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="gs" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- connecting segments -->
      <g id="seg" fill="none" stroke="#d5dae8" stroke-width="2">
        <path id="s0" d="M69 80 H116"/>
        <path id="s1" d="M184 80 H416"/>
        <path id="s2" d="M484 80 H716"/>
        <path id="s3" d="M784 80 H1016"/>
      </g>
      <!-- flowing dashes -->
      <g fill="none" stroke="#f0980f" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.95">
        <use href="#s0"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="2.2s" repeatCount="indefinite"/></use>
        <use href="#s1"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="2.4s" repeatCount="indefinite"/></use>
        <use href="#s2"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="2.6s" repeatCount="indefinite"/></use>
        <use href="#s3"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="2.3s" repeatCount="indefinite"/></use>
      </g>
      <!-- pulse dots -->
      <g fill="#f0980f" filter="url(#g)">
        <circle r="3.4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#s0"/></animateMotion></circle>
        <circle r="3.4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion></circle>
        <circle r="3.4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion></circle>
        <circle r="3.4"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion></circle>
        <circle r="3.4"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion></circle>
        <circle r="3.4"><animateMotion dur="2.3s" repeatCount="indefinite"><mpath href="#s3"/></animateMotion></circle>
        <circle r="3.4"><animateMotion dur="2.3s" begin="1.1s" repeatCount="indefinite"><mpath href="#s3"/></animateMotion></circle>
      </g>
      <!-- flow chevrons -->
      <g stroke="#b9c0d4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M296 74 l7 6 l-7 6"/><path d="M596 74 l7 6 l-7 6"/><path d="M896 74 l7 6 l-7 6"/>
      </g>

      <!-- SUN (energy source) -->
      <g transform="translate(45 80)">
        <g stroke="#e8920f" stroke-width="2.4" stroke-linecap="round" filter="url(#g)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
          <line x1="0" y1="-17" x2="0" y2="-23"/><line x1="0" y1="17" x2="0" y2="23"/>
          <line x1="-17" y1="0" x2="-23" y2="0"/><line x1="17" y1="0" x2="23" y2="0"/>
          <line x1="-12" y1="-12" x2="-16" y2="-16"/><line x1="12" y1="-12" x2="16" y2="-16"/>
          <line x1="-12" y1="12" x2="-16" y2="16"/><line x1="12" y1="12" x2="16" y2="16"/>
        </g>
        <circle r="12" fill="#ffb700" filter="url(#gs)"/><circle r="12" fill="#f7a81c"/><circle r="7" fill="#ffd166"/>
      </g>

      <!-- ===== NODES ===== -->
      <!-- 01 Tracker -->
      <g>
        <circle cx="150" cy="80" r="34" fill="#ffffff" stroke="#232544" stroke-width="1.6"/>
        <circle cx="150" cy="80" r="34" fill="none" stroke="#f0980f" stroke-width="1.5">
          <animate attributeName="r" values="34;41;34" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.55;0;0.55" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <g transform="translate(150 80)">
          <line x1="-13" y1="14" x2="13" y2="14" stroke="#232544" stroke-width="1.6"/>
          <line x1="0" y1="14" x2="0" y2="3" stroke="#232544" stroke-width="1.6"/>
          <g transform="rotate(-22)"><rect x="-15" y="-7" width="30" height="8" rx="1.5" fill="#232544"/><rect x="-15" y="-7" width="30" height="2.6" fill="#f0980f"/></g>
          <circle cx="0" cy="3" r="2.3" fill="#f0980f"/>
        </g>
        <text x="150" y="28" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#ef9a1e">01</text>
        <text x="150" y="142" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#232544">TRACKER</text>
      </g>

      <!-- 02 Network -->
      <g>
        <circle cx="450" cy="80" r="34" fill="#ffffff" stroke="#232544" stroke-width="1.6"/>
        <circle cx="450" cy="80" r="34" fill="none" stroke="#f0980f" stroke-width="1.5">
          <animate attributeName="r" values="34;41;34" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.55;0;0.55" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <g transform="translate(450 80)" stroke="#232544" stroke-width="1.6" fill="none">
          <rect x="-15" y="-13" width="30" height="10" rx="2"/>
          <rect x="-15" y="1" width="30" height="10" rx="2"/>
          <circle cx="-10" cy="-8" r="1.5" fill="#f0980f" stroke="none"/>
          <circle cx="-10" cy="6" r="1.5" fill="#f0980f" stroke="none"/>
          <line x1="-3" y1="-8" x2="9" y2="-8"/><line x1="-3" y1="6" x2="9" y2="6"/>
        </g>
        <text x="450" y="28" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#ef9a1e">02</text>
        <text x="450" y="142" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#232544">NETWORK</text>
      </g>

      <!-- 03 Monitoring -->
      <g>
        <circle cx="750" cy="80" r="34" fill="#ffffff" stroke="#232544" stroke-width="1.6"/>
        <circle cx="750" cy="80" r="34" fill="none" stroke="#f0980f" stroke-width="1.5">
          <animate attributeName="r" values="34;41;34" dur="2.6s" begin="1.0s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.55;0;0.55" dur="2.6s" begin="1.0s" repeatCount="indefinite"/>
        </circle>
        <g transform="translate(750 80)" stroke="#232544" stroke-width="1.6" fill="none">
          <rect x="-16" y="-12" width="32" height="21" rx="2"/>
          <polyline points="-11,5 -4,-3 3,1 12,-8" stroke="#f0980f" stroke-width="2.2"/>
          <line x1="0" y1="9" x2="0" y2="13"/><line x1="-7" y1="13" x2="7" y2="13"/>
        </g>
        <text x="750" y="28" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#ef9a1e">03</text>
        <text x="750" y="142" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#232544">MONITORING</text>
      </g>

      <!-- 04 Power -->
      <g>
        <circle cx="1050" cy="80" r="34" fill="#ffffff" stroke="#232544" stroke-width="1.6"/>
        <circle cx="1050" cy="80" r="34" fill="none" stroke="#f0980f" stroke-width="1.5">
          <animate attributeName="r" values="34;41;34" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.55;0;0.55" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
        <g transform="translate(1050 80)">
          <rect x="-16" y="-10" width="27" height="20" rx="2.5" fill="none" stroke="#232544" stroke-width="1.6"/>
          <rect x="11" y="-4" width="3.5" height="8" rx="1" fill="#232544"/>
          <path d="M-1 -7 L-8 2 H-2 L-4 9 L6 -2 H0 Z" fill="#f0980f"/>
        </g>
        <text x="1050" y="28" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#ef9a1e">04</text>
        <text x="1050" y="142" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#232544">POWER</text>
      </g>

    </svg>
  </div>
</body>
</html>
