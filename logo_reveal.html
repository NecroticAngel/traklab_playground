<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tracklab Solar - Experience the shift. Cinematic logo reveal.">
  <title>Tracklab Solar | Welcome</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="logo_reveal.css?v=7">
</head>
<body class="reveal-body">

  <main class="reveal-main" id="revealMain">
    
    <!-- The Rising Tracksol Icon Sun (Rises behind/above the logo) -->
    <div class="reveal-sun" id="sun">
      <div class="sun-glow-wrapper">
        <div class="sun-glow"></div>
        <img src="AA_jodev/tracksol%20icon.png" alt="Tracksol Solar Icon" class="sun-icon-img">
      </div>
      <img src="AA_jodev/Logo Blue.webp" alt="Tracklab Solar Logo" class="reveal-logo-sun" id="revealLogo">
    </div>

    <!-- Centered Brand Logo -->
    <div class="reveal-logo-wrapper" id="logoWrapper">
      <h3 class="reveal-slogan">Solar innovation in africa.</h3>
    </div>

    <!-- Left-Side Dynamic Energy Yield Meter -->
    <div class="left-energy-meter">
      <div class="meter-label">GENERATION YIELD</div>
      <div class="meter-track">
        <div class="energy-bar-fill">
          <div class="energy-glow-overlay"></div>
        </div>
        <!-- Threshold marker corresponding to the logo level -->
        <div class="meter-threshold-marker">
          <span class="threshold-label">2X STAGE</span>
        </div>
      </div>
      <!-- 2X Indicator Badge next to the meter -->
      <div class="yield-badge-2x">
        <span class="badge-icon">☼</span>
        <span class="badge-text">2x YIELD</span>
      </div>
    </div>

    <!-- Floating watermark tracker in bottom left corner -->
    <div class="bottom-left-tracker">
      <svg viewBox="0 0 300 200" width="240" height="160" xmlns="http://www.w3.org/2000/svg">
        <!-- Post -->
        <rect x="148" y="80" width="4" height="90" fill="#1f1d34" opacity="0.3" />
        <!-- Tracker rotating group -->
        <g class="tracker-span-reveal" style="transform-origin: 150px 80px;">
          <line x1="80" y1="80" x2="220" y2="80" stroke="#1f1d34" stroke-width="5" stroke-linecap="round" />
          <!-- Solar module grid cells -->
          <rect x="85" y="73" width="26" height="6" fill="#1f1d34" opacity="0.8" />
          <rect x="116" y="73" width="26" height="6" fill="#1f1d34" opacity="0.8" />
          <rect x="158" y="73" width="26" height="6" fill="#1f1d34" opacity="0.8" />
          <rect x="189" y="73" width="26" height="6" fill="#1f1d34" opacity="0.8" />
          <!-- Pivot axle -->
          <circle cx="150" cy="80" r="5" fill="#ffffff" stroke="#1f1d34" stroke-width="2"/>
        </g>
      </svg>
    </div>

    <!-- Solid Brand Slate Mask (Starts covering the screen, then slides upward to reveal) -->
    <div class="brand-slate-mask" id="slateMask"></div>

    <!-- Spaced Entry Controls (Positioned at bottom center, fades in once sunrise completes) -->
    <div class="reveal-controls" id="revealControls">
      <a href="index.html" class="enter-site-cta" id="enterCta">Enter Main Site</a>
      <button class="replay-intro-btn" id="replayBtn">☼ Replay Intro</button>
    </div>

  </main>

  <!-- Scripts -->
  <script src="logo_reveal.js?v=7"></script>
</body>
</html>
