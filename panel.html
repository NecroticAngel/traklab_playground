<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tracklab Solar Sandbox - Mouse tracking solar panel. Move your cursor to tilt a high-detail single axis tracker in real-time.">
  <title>Tracklab Solar | Mouse Tracker Sandbox</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="playground-body sandbox-body">

  <!-- Background Ambience & Stars -->
  <div class="stars-overlay" id="starsOverlay"></div>

  <!-- Header / Navigation -->
  <header class="main-header">
    <a href="index.html" class="logo">
      <span class="logo-icon">☼</span>
      <span class="logo-text">tracklab</span>
      <span class="logo-badge">Mouse Sandbox</span>
    </a>
    <nav class="desktop-nav">
      <a href="index.html" class="nav-link">Technology</a>
      <a href="tracker.html" class="nav-link">Simulation Lab</a>
      <a href="panel.html" class="nav-cta">Mouse Sandbox</a>
    </nav>
  </header>

  <!-- Sandbox Viewport -->
  <main class="sandbox-main">
    <div class="sandbox-header animate-on-scroll visible">
      <span class="sandbox-title-badge">INTERACTIVE LAB</span>
      <h2 class="sandbox-main-title">Move your mouse across the page to steer the tracker</h2>
    </div>

    <!-- Center SVG Container -->
    <div class="detailed-tracker-container">
      <svg viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid meet" class="sandbox-svg" id="sandboxSvg">
        <!-- Glowing Sun Beam overlay (laser ray from cursor) -->
        <line id="sunBeam" x1="720" y1="320" x2="720" y2="100" stroke="#ffb13b" stroke-width="3" stroke-dasharray="8,6" opacity="0" stroke-linecap="round" />
        
        <!-- FOUNDATION SUPPORT POSTS -->
        <rect x="710" y="320" width="20" height="240" fill="#080c14" rx="2" />
        <line x1="710" y1="380" x2="680" y2="560" stroke="#080c14" stroke-width="4" stroke-linecap="round" />
        <line x1="730" y1="380" x2="760" y2="560" stroke="#080c14" stroke-width="4" stroke-linecap="round" />

        <!-- SLEW GEAR BOX DRIVE (Pivoting Axis center) -->
        <circle cx="720" cy="320" r="28" fill="#0c111c" stroke="#152136" stroke-width="4" />
        <circle cx="720" cy="320" r="18" fill="#1b2538" stroke="#ffb13b" stroke-width="1.5" />

        <!-- DETAILED DYNAMIC ROTATING MODULE (Tracker Span) -->
        <g class="tracker-span" id="detailedTrackerSpan" style="transform-origin: 720px 320px;">
          <!-- Heavy Steel Backing Frame -->
          <rect x="360" y="310" width="720" height="20" rx="6" fill="#0e1424" stroke="#1b273d" stroke-width="2.5" />
          
          <!-- Steel Mounting Brackets -->
          <line x1="430" y1="310" x2="430" y2="280" stroke="#1b273d" stroke-width="4" />
          <line x1="550" y1="310" x2="550" y2="280" stroke="#1b273d" stroke-width="4" />
          <line x1="670" y1="310" x2="670" y2="280" stroke="#1b273d" stroke-width="4" />
          <line x1="770" y1="310" x2="770" y2="280" stroke="#1b273d" stroke-width="4" />
          <line x1="890" y1="310" x2="890" y2="280" stroke="#1b273d" stroke-width="4" />
          <line x1="1010" y1="310" x2="1010" y2="280" stroke="#1b273d" stroke-width="4" />

          <!-- HIGH-DETAIL PV MODULE PANELS (6 Modules) -->
          <!-- Module 1 -->
          <g>
            <rect x="380" y="250" width="100" height="60" rx="3" fill="#091626" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            <!-- Solar wafer grid cells inside module -->
            <line x1="405" y1="250" x2="405" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="430" y1="250" x2="430" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="455" y1="250" x2="455" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="380" y1="280" x2="480" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
          </g>
          <!-- Module 2 -->
          <g>
            <rect x="500" y="250" width="100" height="60" rx="3" fill="#091626" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            <line x1="525" y1="250" x2="525" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="550" y1="250" x2="550" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="575" y1="250" x2="575" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="500" y1="280" x2="600" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
          </g>
          <!-- Module 3 -->
          <g>
            <rect x="620" y="250" width="90" height="60" rx="3" fill="#091626" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            <line x1="642" y1="250" x2="642" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="665" y1="250" x2="665" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="688" y1="250" x2="688" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="620" y1="280" x2="710" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
          </g>
          <!-- Module 4 -->
          <g>
            <rect x="730" y="250" width="90" height="60" rx="3" fill="#091626" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            <line x1="752" y1="250" x2="752" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="775" y1="250" x2="775" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="798" y1="250" x2="798" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="730" y1="280" x2="820" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
          </g>
          <!-- Module 5 -->
          <g>
            <rect x="840" y="250" width="100" height="60" rx="3" fill="#091626" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            <line x1="865" y1="250" x2="865" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="890" y1="250" x2="890" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="915" y1="250" x2="915" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="840" y1="280" x2="940" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
          </g>
          <!-- Module 6 -->
          <g>
            <rect x="960" y="250" width="100" height="60" rx="3" fill="#091626" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
            <line x1="985" y1="250" x2="985" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="1010" y1="250" x2="1010" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="1035" y1="250" x2="1035" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
            <line x1="960" y1="280" x2="1060" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />
          </g>

          <!-- Slewing Axis Pivot circle cap -->
          <circle cx="720" cy="320" r="9" fill="#1b2538" stroke="#ffb13b" stroke-width="1.5" />
          <circle cx="720" cy="320" r="4" fill="#4ea8de" />
        </g>
      </svg>
    </div>

    <!-- Telemetry HUD Card -->
    <div class="playground-hud sandbox-hud" id="sandboxHud">
      <div class="hud-header">
        <div class="hud-title-block">
          <span class="hud-badge-live" id="hudStatusBadge">ACTIVE MOUSE TRACKING</span>
          <h3 class="hud-main-title">Structural Alignment Analysis</h3>
        </div>
        <div class="hud-limit-badge" id="hudLimitBadge">OPERATIONAL</div>
      </div>

      <hr class="hud-divider">

      <!-- Real-time metrics grid -->
      <div class="hud-metrics-grid">
        <div class="hud-metric-card">
          <span class="hud-metric-label">Target Angle</span>
          <span class="hud-metric-value" id="sandboxTargetAngle">0.0°</span>
        </div>
        <div class="hud-metric-card">
          <span class="hud-metric-label">Tracker Alignment</span>
          <span class="hud-metric-value accent-text" id="sandboxTrackerAngle">0.0°</span>
        </div>
        <div class="hud-metric-card">
          <span class="hud-metric-label">Capture Efficiency</span>
          <span class="hud-metric-value" id="sandboxEfficiency">100.0%</span>
        </div>
        <div class="hud-metric-card">
          <span class="hud-metric-label">Fixed-Tilt Loss</span>
          <span class="hud-metric-value" id="sandboxFixedLoss">0.0%</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Custom Sun Cursor -->
  <div id="customCursor" class="custom-sun-cursor">
    <svg viewBox="0 0 40 40" width="40" height="40">
      <circle cx="20" cy="20" r="14" stroke="#ffb13b" stroke-width="2.5" stroke-dasharray="5,3" class="cursor-sun-ray" />
      <circle cx="20" cy="20" r="7" fill="#ffffff" stroke="#ff9f1c" stroke-width="2" />
    </svg>
  </div>

  <!-- Scripts -->
  <script src="panel.js?v=2"></script>
</body>
</html>
